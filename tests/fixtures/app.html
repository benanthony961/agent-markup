<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Acme Orders</title>
<style>
  body { margin: 0; font: 15px/1.4 -apple-system, system-ui, sans-serif; color: #1b1d22; background: #f6f7f9; }
  header { display: flex; gap: 20px; align-items: center; height: 56px; padding: 0 24px; background: #fff; border-bottom: 1px solid #e3e5ea; }
  header a { color: #3b3f48; text-decoration: none; font-weight: 500; }
  main { padding: 32px 24px 400px; max-width: 720px; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #c9ccd4; background: #fff; cursor: pointer; }
  button.primary { background: #1b1d22; color: #fff; border-color: #1b1d22; }
  form { display: none; margin-top: 20px; padding: 20px; background: #fff; border: 1px solid #e3e5ea; border-radius: 12px; }
  form.open { display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-weight: 500; }
  input[type=text], select { font: inherit; padding: 8px 10px; border: 1px solid #c9ccd4; border-radius: 8px; background: #fff; }
  .check { display: flex; gap: 8px; align-items: center; }
  #toast { display: none; margin-top: 16px; padding: 10px 14px; border-radius: 8px; background: #e6f6ea; color: #1d6b33; }
  #toast.show { display: block; }
</style>
</head>
<body>
  <header><strong>Acme</strong><a href="/orders" id="nav-orders">Orders</a><a href="/settings">Settings</a></header>
  <main>
    <h1 id="heading">Dashboard</h1>
    <button class="primary" data-testid="new-order" onclick="document.querySelector('form').classList.add('open')">New order</button>
    <form onsubmit="event.preventDefault(); document.getElementById('toast').classList.add('show')">
      <label>Customer <input type="text" id="customer" placeholder="Search customers"></label>
      <label>Size <select id="size"><option>9</option><option>10</option><option>10.5</option><option>11</option></select></label>
      <label class="check"><input type="checkbox" id="rush"> Rush delivery</label>
      <div><button class="primary" type="submit">Save order</button></div>
    </form>
    <div id="toast" role="status">Order saved</div>
  </main>
  <script>
    document.getElementById("nav-orders").addEventListener("click", (e) => {
      e.preventDefault();
      history.pushState({}, "", "/orders");
      document.getElementById("heading").textContent = "Orders";
    });
  </script>
</body>
</html>
